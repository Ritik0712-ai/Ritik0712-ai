name: Update profile stats

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  push:
    branches: [main]
    paths-ignore: ['assets/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate stats, calendar and recent activity
        run: node .github/scripts/generate.mjs
        env:
          # Optional PROFILE_TOKEN (a personal token) also counts private
          # contributions; the built-in token covers public activity.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update profile stats"
          git push
